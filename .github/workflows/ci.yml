name: Supreme CI

on:
  push:
    branches: [ main ]
    paths:
      - 'supreme/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'supreme/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x supreme/gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: supreme
      
    - name: Run unit tests
      run: ./gradlew test
      working-directory: supreme
      
    - name: Run lint
      run: ./gradlew lint
      working-directory: supreme
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: supreme-debug-apk
        path: supreme/apps/android/build/outputs/apk/debug/*.apk
        retention-days: 7
