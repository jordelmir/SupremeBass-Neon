<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Graphic - Supreme Acoustics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .glow-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .glow-circle-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,102,0,0.1) 0%, transparent 70%);
            top: 30%;
            left: 70%;
            transform: translate(-50%, -50%);
        }
        .title {
            font-size: 64px;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 40px rgba(0,255,255,0.6), 0 0 80px rgba(0,255,255,0.3);
            letter-spacing: 6px;
            z-index: 1;
            text-align: center;
        }
        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #ff6600;
            text-shadow: 0 0 20px rgba(255,102,0,0.5);
            letter-spacing: 8px;
            margin-top: 16px;
            z-index: 1;
            text-align: center;
        }
        .features {
            display: flex;
            gap: 40px;
            margin-top: 40px;
            z-index: 1;
        }
        .feature {
            text-align: center;
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .line {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            margin-top: 30px;
            z-index: 1;
        }
        .brand {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: #444;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="glow-circle"></div>
    <div class="glow-circle-2"></div>
    <div class="title">SUPREME ACOUSTICS</div>
    <div class="subtitle">PROFESSIONAL AUDIO LAB</div>
    <div class="features">
        <div class="feature">
            <div class="feature-icon">🎵</div>
            SIGNAL GENERATOR
        </div>
        <div class="feature">
            <div class="feature-icon">📊</div>
            DEVICE LAB
        </div>
        <div class="feature">
            <div class="feature-icon">🔥</div>
            FLAME LAB
        </div>
        <div class="feature">
            <div class="feature-icon">⚡</div>
            NATIVE DSP
        </div>
    </div>
    <div class="line"></div>
    <div class="brand">SUPREME CORP™</div>
</body>
</html>
